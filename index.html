<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>AISEGF’26 — Checklist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Organisation</p>
      <h1>Checklist — Conférence AISEGF’26</h1>
      <p class="subtitle">Tableau partagé pour renseigner rapidement l’avancement de toutes les tâches.</p>
    </div>
    <div class="sync" id="syncStatus">● Prêt</div>
  </header>

  <main class="container">
    <section class="stats" aria-label="Résumé">
      <article><span id="statTotal">0</span><small>Tâches</small></article>
      <article><span id="statDone">0</span><small>Terminées</small></article>
      <article><span id="statProgress">0%</span><small>Avancement moyen</small></article>
    </section>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Rechercher une tâche, un responsable…" />
      <select id="statusFilter">
        <option value="all">Tous les statuts</option>
        <option value="Non commencé">Non commencé</option>
        <option value="En cours">En cours</option>
        <option value="Terminé">Terminé</option>
      </select>
      <button id="saveAllBtn" class="btn">Enregistrer tout</button>
      <button id="resetBtn" class="btn ghost">Réinitialiser l’affichage</button>
    </section>

    <div id="notice" class="notice hidden"></div>

    <section class="table-card">
      <div class="table-wrap">
        <table class="checklist-table">
          <thead>
            <tr>
              <th class="col-task">Tâche</th>
              <th class="col-action">Actions à entreprendre</th>
              <th>Responsable</th>
              <th>Date d’exécution</th>
              <th>Actions entreprises</th>
              <th>Statut</th>
              <th>Taux d’exécution</th>
              <th>Observation</th>
              <th class="col-save">État</th>
            </tr>
          </thead>
          <tbody id="taskBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <template id="rowTemplate">
    <tr class="task-row">
      <td class="task-category"></td>
      <td class="task-title"></td>
      <td><input class="responsible" type="text" placeholder="Nom" /></td>
      <td><input class="date" type="date" /></td>
      <td><textarea class="actions" rows="2" placeholder="Ce qui a été réalisé…"></textarea></td>
      <td>
        <select class="status">
          <option>Non commencé</option>
          <option>En cours</option>
          <option>Terminé</option>
        </select>
      </td>
      <td>
        <div class="progress-cell">
          <input class="progress" type="number" min="0" max="100" step="5" value="0" />
          <span>%</span>
        </div>
      </td>
      <td><textarea class="notes" rows="2" placeholder="Remarques…"></textarea></td>
      <td><span class="saved-at">—</span></td>
    </tr>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
